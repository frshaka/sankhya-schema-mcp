name: CI

# Os testes só rodavam quando alguém lembrava ou dentro do `tools/release.sh` —
# tarde demais: a quebra aparecia na hora de publicar. Aqui rodam a cada push
# e a cada PR.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  testes:
    name: Autoteste (SDK MCP ${{ matrix.sdk.nome }})
    runs-on: ubuntu-latest
    # O servidor roda nos dois SDKs: o 2.x é o do requirements.txt e o 1.x é o
    # de quem fez `git pull` sem reinstalar as dependências (fallback em
    # src/server.py). Um SDK quebrado não pode passar despercebido pelo outro.
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - { nome: "2.x", pacote: "" }
          - { nome: "1.x", pacote: "mcp[cli]>=1.0.0,<2.0.0" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `requirements.txt` traz o driver Oracle, que instala por wheel e não
      # precisa do Instant Client para o import: os testes não abrem conexão.
      - name: Instala as dependências
        run: pip install -r requirements.txt

      - name: Troca para o SDK MCP 1.x
        if: matrix.sdk.pacote != ''
        run: pip install "${{ matrix.sdk.pacote }}"

      - name: Roda os testes
        run: python test_server.py
